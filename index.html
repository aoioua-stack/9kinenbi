<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大切なキミへ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transition: all 0.5s ease;
            z-index: 5;
            margin-top: 20px;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        p {
            color: #4a4a4a;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .input-date {
            width: 80%;
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid #ffb3c1;
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin-top: 10px;
            color: #4a4a4a;
        }
        .input-date:focus {
            border-color: #ff4d6d;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 15px;
            text-decoration: none; /* リンク化時の下線消去 */
            display: inline-block; /* サイズの適正化 */
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* お手紙を読むボタン専用の特別な色（少しゴージャスにゴールドピンク） */
        .btn-letter {
            background-color: #ff3366;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.3);
            margin-top: 5px;
        }

        .falling-item {
            position: absolute;
            user-select: none;
            z-index: 2;
        }

        .heart {
            color: #ff4d6d;
            font-size: 28px;
            animation: floatUp 2.5s linear infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-15vh) scale(1.8) rotate(360deg);
                opacity: 0;
            }
        }

        .mail {
            font-size: 38px;
            cursor: pointer;
            animation: fallDown 5s linear forwards;
            padding: 10px;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) translateX(20px) rotate(20deg);
                opacity: 0;
            }
        }

        .hidden {
            display: none;
        }

        .clear-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ff1a43;
            line-height: 1.6;
            animation: pop 0.5s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="stage1" class="card">
        <h1>記念日ミニゲーム❤</h1>
        <p>いつもありがとう！<br>用意したゲームをクリアして、メッセージを受け取ってね！</p>
        <button class="btn" onclick="nextStage(1, 2)">ゲームを始める！</button>
    </div>

    <div id="stage2" class="card hidden">
        <h1>ミッション1：パスワード</h1>
        <p>私たちの「記念日」を入力してね！<br><span style="font-size: 0.8rem; color: #888;">（例：○月○日）</span></p>
        <input type="text" id="date-input" class="input-date" placeholder="例：8月31日">
        <br>
        <button class="btn" onclick="checkPassword()">認証する</button>
    </div>

    <div id="stage3" class="card hidden">
        <h1>ミッション2：郵便屋さん</h1>
        <p>上から流れてくる郵便物（✉️）を、画面をタップして【10個】キャッチしてね！</p>
        <p style="font-size: 1.2rem; font-weight: bold; color: #ff4d6d; margin: 10px 0;">
            集めた数: <span id="mail-count">0</span> / 10 個
        </p>
    </div>

    <div id="stage4" class="card hidden">
        <h1>最終ミッション！</h1>
        <p>ハートのメーターを満慢にして、ラブレターを開封しよう！</p>
        <p style="font-size: 0.8rem; color: #999;">（ボタンを10回タップしてね）</p>
        <div style="background: #eee; border-radius: 10px; height: 20px; width: 100%; margin: 15px 0; overflow: hidden;">
            <div id="bar" style="background: #ff4d6d; height: 100%; width: 0%; transition: width 0.2s;"></div>
        </div>
        <button id="heart-btn" class="btn" onclick="tapHeart()">❤ ハートを送る ❤</button>
    </div>

    <div id="stage5" class="card hidden">
        <p class="clear-text">🎉 GAME CLEAR 🎉</p>
        <hr style="border: 1px dashed #ff4d6d; margin: 15px 0;">
        <p class="clear-text" style="font-size: 1.3rem; margin-bottom: 10px;">
            ９ヶ月間ありがとう！！！<br>これからもずっとよろしくね！！
        </p>
        <p style="font-size: 2.5rem; margin: 5px 0;">💖</p>
        
        <a href="001.HEIC" class="btn btn-letter">💌 お手紙を読む</a>
    </div>

    <script>
        function nextStage(current, next) {
            document.getElementById(`stage${current}`).classList.add('hidden');
            document.getElementById(`stage${next}`).classList.remove('hidden');
        }

        function checkPassword() {
            const input = document.getElementById('date-input').value.trim();
            if (input === '8月31日' || input === '８月３１日') {
                nextStage(2, 3);
                startMailGame();
            } else {
                alert('あれれ？もう一回考えてみてね！😘');
            }
        }

        let caughtMails = 0;
        let mailInterval;

        function startMailGame() {
            mailInterval = setInterval(createMail, 500);
        }

        function createMail() {
            if (caughtMails >= 10) return;

            const mail = document.createElement('div');
            mail.classList.add('falling-item', 'mail');
            mail.innerText = '✉️';
            mail.style.left = Math.random() * 85 + 'vw';
            mail.style.animationDuration = Math.random() * 1.5 + 4.5 + 's'; 

            mail.addEventListener('touchstart', catchMail);
            mail.addEventListener('mousedown', catchMail);

            document.body.appendChild(mail);

            setTimeout(() => { mail.remove(); }, 6000);
        }

        function catchMail(e) {
            e.preventDefault();
            const mail = e.target;
            mail.remove();
            
            caughtMails++;
            document.getElementById('mail-count').innerText = caughtMails;

            let touchX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            let touchY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

            const miniHeart = document.createElement('div');
            miniHeart.innerText = '✨';
            miniHeart.style.position = 'absolute';
            miniHeart.style.left = touchX + 'px';
            miniHeart.style.top = touchY + 'px';
            miniHeart.style.fontSize = '20px';
            miniHeart.style.transition = 'all 0.5s';
            miniHeart.style.zIndex = '10';
            document.body.appendChild(miniHeart);
            setTimeout(() => {
                miniHeart.style.transform = 'translateY(-20px)';
                miniHeart.style.opacity = 0;
                setTimeout(() => miniHeart.remove(), 500);
            }, 10);

            if (caughtMails >= 10) {
                clearInterval(mailInterval);
                document.querySelectorAll('.mail').forEach(m => m.remove());
                setTimeout(() => {
                    nextStage(3, 4);
                }, 500);
            }
        }

        let count = 0;
        let isFinished = false;

        function tapHeart() {
            if (isFinished) return;

            count++;
            let percent = count * 10;
            document.getElementById('bar').style.width = percent + '%';
            
            createHeart();

            if (count >= 10) {
                isFinished = true;
                document.getElementById('heart-btn').disabled = true;

                for (let i = 0; i < 80; i++) {
                    setTimeout(createHeart, Math.random() * 800); 
                }

                setTimeout(() => {
                    nextStage(4, 5);
                    setInterval(createHeart, 200);
                }, 2500);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-item', 'heart');
            const heartTypes = ['💝', '💖', '💗', '❤️', '💕'];
            heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 15 + 20 + 'px';
            heart.style.animationDuration = Math.random() * 1.5 + 1.5 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 2500);
        }
    </script>
</body>
</html>
